name: Backend Quality Gate

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrilink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agrilink_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npm run lint
          git diff --exit-code

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run Storage quality gates
        run: npm run test:storage -- --runInBand

      - name: Run end-to-end tests
        run: npm run test:e2e -- --runInBand

      - name: Run Storage REST contract tests
        run: npm run test:storage:e2e -- --runInBand

      - name: Run Storage Phase 9 migration integration
        env:
          STORAGE_MIGRATION_TESTS: "true"
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASS: postgres
          DB_NAME: agrilink_test
        run: npm run test:storage:migration -- --runInBand

      - name: Build
        run: npm run build
