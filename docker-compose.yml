version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agrilink_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrilink_db
      POSTGRES_USER: agrilink
      POSTGRES_PASSWORD: agrilink_dev_2025
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agrilink -d agrilink_db']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agrilink_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agrilink.vn
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
